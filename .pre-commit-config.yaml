repos:
- repo: local
  hooks:
    - id: ruff-check
      name: ruff lint
      entry: uv run ruff check --fix
      language: system
      pass_filenames: false

    - id: ruff-format
      name: ruff format
      entry: uv run ruff format
      language: system
      pass_filenames: false

    - id: sphinx-apidoc
      name: regenerate sphinx apidoc
      entry: uv run sphinx-apidoc -o docs/source/api src/sq -f
      language: system
      pass_filenames: false

    - id: ty
      name: ty type check
      entry: uv run ty check --error all
      language: system
      pass_filenames: false