[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project]
name = "sq"
version = "0.1.0"
description = "sq (saqal hq (hep-queue))"
requires-python = ">=3.14.7"
dependencies = [
    "cloudpickle>=3.1.2",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.78",
]
